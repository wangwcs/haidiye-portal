<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#f0d48a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Building -->
  <rect x="136" y="180" width="240" height="200" rx="8" fill="url(#gold)" opacity="0.15"/>
  <rect x="176" y="140" width="160" height="40" rx="6" fill="url(#gold)" opacity="0.2"/>
  <rect x="216" y="100" width="80" height="40" rx="6" fill="url(#gold)" opacity="0.25"/>
  <!-- Windows -->
  <rect x="166" y="210" width="36" height="30" rx="4" fill="url(#accent)" opacity="0.3"/>
  <rect x="218" y="210" width="36" height="30" rx="4" fill="url(#accent)" opacity="0.3"/>
  <rect x="270" y="210" width="36" height="30" rx="4" fill="url(#accent)" opacity="0.3"/>
  <rect x="322" y="210" width="36" height="30" rx="4" fill="url(#accent)" opacity="0.3"/>
  <rect x="166" y="260" width="36" height="30" rx="4" fill="url(#accent)" opacity="0.25"/>
  <rect x="218" y="260" width="36" height="30" rx="4" fill="url(#accent)" opacity="0.25"/>
  <rect x="270" y="260" width="36" height="30" rx="4" fill="url(#accent)" opacity="0.25"/>
  <rect x="322" y="260" width="36" height="30" rx="4" fill="url(#accent)" opacity="0.25"/>
  <!-- Door -->
  <rect x="232" y="320" width="48" height="60" rx="6" fill="url(#gold)" opacity="0.35"/>
  <!-- Star -->
  <text x="256" y="88" text-anchor="middle" font-size="40" fill="url(#gold)" opacity="0.7">★</text>
  <!-- Ground line -->
  <rect x="80" y="380" width="352" height="4" rx="2" fill="url(#accent)" opacity="0.2"/>
  <!-- Text -->
  <text x="256" y="440" text-anchor="middle" font-size="32" fill="url(#gold)" font-weight="bold" font-family="sans-serif" opacity="0.8">海迪耶</text>
  <text x="256" y="472" text-anchor="middle" font-size="16" fill="rgba(255,255,255,0.4)" font-family="sans-serif" letter-spacing="4">INTERNAL PORTAL</text>
</svg>
